name: Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened,reopened,synchronize]
  push:
    branches:
      - master

jobs:
  Tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The two maintained LTS lines; engines declares >=22.
        node-version: [22, 24]
        # Windows is not a formality here: this package turns paths into
        # module ids, compares watcher paths against them and writes the
        # artifact by path, so a separator bug would only ever surface on this
        # leg.
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm run test
        env:
          tests: true

  # The install above is SvelteKit 2's; the plugin's own suite runs on
  # SvelteKit 3 as well, on Linux and on Windows, where SvelteKit 3 reads its
  # paths off the Vite root. SvelteKit 3 asks for TypeScript 6 once one is
  # installed, so it comes along, after the build.
  Kit-3:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install SvelteKit 3
        run: npm install --no-save @sveltejs/kit@^3.0.0 @sveltejs/adapter-node@^6.0.0 typescript@^6.0.0

      - name: Name the SvelteKit
        run: node -p "require('./node_modules/@sveltejs/kit/package.json').version"

      - name: Test
        run: npx vitest run tests/specs/plugin.spec.ts
        env:
          tests: true

  Lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      # Without `--fix`, which `npm run lint` passes: a finding fails the job.
      - name: Lint
        run: npx eslint .
